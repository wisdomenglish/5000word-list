<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2500px;
    height: 843px;
    background: #1A1914;
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
  }

  .wrapper {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    gap: 2px;
    background: #2A2820;
  }

  .row {
    display: flex;
    flex: 1;
    gap: 2px;
  }

  .cell {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1A1914;
    gap: 16px;
    padding-bottom: 36px;
    position: relative;
    overflow: hidden;
  }

  /* 左上角裝飾點 */
  .cell::before {
    content: '';
    position: absolute;
    top: 22px;
    left: 22px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #C8A96E;
    opacity: 0.6;
  }

  .icon-wrap {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 2px solid #C8A96E;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(200, 169, 110, 0.08);
  }

  .icon-wrap svg {
    width: 55px;
    height: 55px;
  }

  .label {
    font-size: 58px;
    font-weight: 700;
    color: #F0EAD8;
    letter-spacing: 8px;
  }

  /* 四字詞縮小字間距避免與三字詞寬度落差過大 */
  .label-long {
    letter-spacing: 4px;
  }

  .sub {
    font-size: 26px;
    color: #C8A96E;
    letter-spacing: 2px;
    font-weight: 400;
  }

  /* 底部金線 */
  .cell::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #C8A96E, transparent);
  }
</style>
</head>
<body>
<div class="wrapper">

  <!-- 上排：行事曆、素材庫、公告區 -->
  <div class="row">

    <div class="cell">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C8A96E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </div>
      <div class="label">行事曆</div>
      <div class="sub">Schedule</div>
    </div>

    <div class="cell">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C8A96E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </div>
      <div class="label">素材庫</div>
      <div class="sub">Content Intake</div>
    </div>

    <div class="cell">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C8A96E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
      </div>
      <div class="label">公告區</div>
      <div class="sub">Bulletin</div>
    </div>

  </div>

  <!-- 下排：各式表單、課程進度表、其他 -->
  <div class="row">

    <div class="cell">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C8A96E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
          <line x1="8" y1="16" x2="13" y2="16"/>
        </svg>
      </div>
      <div class="label label-long">各式表單</div>
      <div class="sub">Forms</div>
    </div>

    <div class="cell">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C8A96E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
          <line x1="3" y1="20" x2="21" y2="20"/>
        </svg>
      </div>
      <div class="label label-long">課程進度表</div>
      <div class="sub">Course Progress</div>
    </div>

    <div class="cell">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#C8A96E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </div>
      <div class="label">其他</div>
      <div class="sub">Others</div>
    </div>

  </div>

</div>
</body>
</html>

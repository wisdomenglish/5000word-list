<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2500px; height: 843px; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    font-family: "Microsoft JhengHei", "PingFang TC", "Segoe UI", sans-serif;
    background: #0f172a;
  }
  .row { display: flex; width: 100%; }
  .row.top { height: 422px; }
  .row.bottom { height: 421px; }
  .col {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    position: relative;
    border-right: 4px solid rgba(255,255,255,0.18);
    border-bottom: 4px solid rgba(255,255,255,0.18);
  }
  .row.bottom .col { border-bottom: none; }
  .row .col:last-child { border-right: none; }

  /* 上排：解題模式切換（兩格） */
  .row.top .col { width: 1250px; }
  .top .c-solve { background: linear-gradient(160deg, #0EA5E9, #1E3A8A); }
  .top .c-free { background: linear-gradient(160deg, #64748B, #334155); }
  .top .emoji { font-size: 110px; line-height: 1; margin-bottom: 14px;
    font-family: "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .top .title { font-size: 58px; font-weight: 800; letter-spacing: 3px; margin-bottom: 12px; }
  .top .sub { font-size: 30px; font-weight: 500; opacity: 0.92; }

  /* 下排：作文功能（三格） */
  .row.bottom .col.c1 { width: 833px; background: linear-gradient(160deg, #2563EB, #1E3A8A); }
  .row.bottom .col.c2 { width: 834px; background: linear-gradient(160deg, #16A34A, #166534); }
  .row.bottom .col.c3 { width: 833px; background: linear-gradient(160deg, #D946EF, #7E22CE); }
  .bottom .emoji { font-size: 100px; line-height: 1; margin-bottom: 12px;
    font-family: "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .bottom .title { font-size: 46px; font-weight: 800; letter-spacing: 2px; margin-bottom: 10px; }
  .bottom .sub { font-size: 24px; font-weight: 500; opacity: 0.92; line-height: 1.3; padding: 0 20px; }
  .bottom .lvl { margin-top: 10px; font-size: 20px; font-weight: 700;
    background: rgba(255,255,255,0.22); padding: 6px 20px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="row top">
    <div class="col c-solve">
      <div class="emoji">🧩</div>
      <div class="title">開始解題</div>
      <div class="sub">拍照或打字描述題目，直接幫你解</div>
    </div>
    <div class="col c-free">
      <div class="emoji">💬</div>
      <div class="title">自由對話</div>
      <div class="sub">單字・文法・翻譯，直接問我</div>
    </div>
  </div>
  <div class="row bottom">
    <div class="col c1">
      <div class="emoji">📝</div>
      <div class="title">作文批改</div>
      <div class="sub">找出優缺點<br>給你修改建議</div>
    </div>
    <div class="col c2">
      <div class="emoji">✏️</div>
      <div class="title">初階改寫</div>
      <div class="sub">保留原意・修正文法</div>
      <div class="lvl">A2–B1</div>
    </div>
    <div class="col c3">
      <div class="emoji">🎯</div>
      <div class="title">進階改寫</div>
      <div class="sub">全面提升到母語水準</div>
      <div class="lvl">B2–C1</div>
    </div>
  </div>
</body>
</html>
